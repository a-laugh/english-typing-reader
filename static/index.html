<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小小打字员 Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            max-height: 100vh; /* 限制body高度不溢出 */
            overflow: hidden; /* 隐藏body的滚动条 */
            background-color: #eef2f7;
            margin: 0;
            padding: 20px; /* 页面边缘固定内边距 */
            box-sizing: border-box;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 30px; /* 容器内边距 */
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1200px; /* 【核心】调整最大宽度，可根据屏幕大小调整，例如1000px-1400px */
            height: calc(100vh - 40px); /* 适应body的padding，保持总高度不溢出 */
            overflow: hidden; /* 隐藏容器自身的滚动条 */
            text-align: center;
            border: 1px solid #e0e6ed;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px; /* 标题下方间距 */
            font-size: 2.8em; /* 标题字体大小 */
        }

        #controls-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px; /* 控件间距 */
            margin-bottom: 25px; /* 控制面板下方间距 */
            padding: 15px;
            border: 1px dashed #cad2db;
            border-radius: 8px;
            background-color: #f9fbfd;
        }
        #controls-panel input[type="file"] {
            display: none;
        }
        .custom-file-upload, #upload-btn, #text-selector, #load-text-btn {
            padding: 10px 18px; /* 按钮和选择器内边距 */
            border-radius: 5px;
            font-size: 1em; /* 字体大小 */
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .custom-file-upload {
            border: 1px solid #007bff;
            display: inline-block;
            background-color: #007bff;
            color: white;
        }
        .custom-file-upload:hover {
            background-color: #0056b3;
        }
        #upload-btn {
            border: none;
            background-color: #28a745;
            color: white;
        }
        #upload-btn:hover {
            background-color: #218838;
        }
        #text-selector {
            border: 1px solid #ccc;
            background-color: white;
        }
        #load-text-btn {
            border: none;
            background-color: #ffc107;
            color: #333;
        }
        #load-text-btn:hover {
            background-color: #e0a800;
        }
        
        #main-content {
            display: flex;
            gap: 25px; /* 主内容区域间距 */
            flex-grow: 1; /* 让 main-content 尽可能占据剩余垂直空间 */
            margin-bottom: 25px; /* 主内容区域下方间距 */
            overflow: hidden; /* 隐藏 main-content 自身的滚动条 */
        }

        #original-text-display {
            flex: 3; /* 【核心】给原文显示区更多的弹性空间，例如 3:1 或 4:1 */
            font-size: 1.4em; /* 原文显示字体大小，固定值 */
            padding: 20px; /* 内边距 */
            border: 1px dashed #cad2db;
            border-radius: 8px;
            /* 关键：原文显示区最大高度，确保它能填充剩余垂直空间且内部可滚动 */
            max-height: 100%; /* 限制为父容器的可用高度 */
            overflow-y: auto; /* 关键：内容溢出时显示垂直滚动条 */
            text-align: left;
            line-height: 1.8; /* 调整行高 */
            word-wrap: break-word;
            background-color: #f9fbfd;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        #side-info-panel {
            flex: 1; /* 【核心】侧边栏占据较小弹性空间 */
            display: flex;
            flex-direction: column;
            gap: 15px; /* 侧边栏元素间距 */
            padding: 20px; /* 侧边栏内边距 */
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            background-color: #eef2f7;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
            min-width: 250px; /* 侧边栏最小宽度 */
            max-height: 100%; /* 与 original-text-display 高度同步 */
            overflow: hidden; /* 侧边栏本身不滚动 */
        }

        #result-display {
            flex-grow: 1; /* 让结果显示区占据尽可能多空间 */
            text-align: left;
            font-size: 1.2em; /* 结果显示字体大小 */
            color: #4a4a4a;
            word-wrap: break-word;
            line-height: 1.6; /* 行高 */
            overflow-y: auto; /* 结果定义溢出时内部滚动 */
            padding-bottom: 10px; /* 避免内容紧贴底部 */
        }
        .result-word {
            font-weight: normal;
            color: #6c757d;
            margin-bottom: 5px; /* 间距 */
            display: block;
            font-size: 0.9em; /* 相对于父级，保持小一些 */
        }
        .result-definition {
            font-style: normal;
            font-weight: bold;
            color: #333;
            display: block;
            font-size: 1.1em; /* 定义字体大小 */
        }

        .pronounce-btn {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px; /* 按钮固定大小 */
            height: 60px; /* 保持圆形 */
            font-size: 1.8em; /* 按钮图标大小 */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
            align-self: flex-end; /* 保持在右下角 */
            margin-top: auto; /* 推到底部 */
        }
        .pronounce-btn:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
        .pronounce-btn:active {
            transform: scale(0.98);
        }
        .pronounce-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #typing-input {
            width: calc(100% - 40px); /* 保持与容器宽度一致 */
            padding: 15px 20px; /* 内边距 */
            font-size: 1.4em; /* 输入框字体大小 */
            border: 2px solid #007bff;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.1);
            align-self: center;
        }
        #typing-input:focus {
            border-color: #0056b3;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.2);
        }
        
        .word-correct {
            color: #28a745;
            font-weight: bold;
        }
        .word-incorrect {
            color: #dc3545;
            text-decoration: line-through;
        }
        .current-word {
            background-color: #d1ecf1;
            color: #0c5460;
            padding: 4px 8px; /* 内边距 */
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 0 5px rgba(209, 236, 241, 0.5);
        }
        .correct-input-border {
            border-color: #28a745 !important;
        }
        .incorrect-input-border {
            border-color: #dc3545 !important;
        }

        /* 媒体查询：适配小屏幕设备（如手机） */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                max-width: 95vw;
                padding: 20px;
                height: calc(100vh - 20px); /* 手机上高度也尽可能占满 */
            }
            h1 {
                font-size: 2.2em;
                margin-bottom: 20px;
            }
            #controls-panel {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .custom-file-upload, #upload-btn, #text-selector, #load-text-btn {
                width: 100%;
                font-size: 1em;
                padding: 12px 18px;
            }
            #main-content {
                flex-direction: column;
                gap: 20px;
                flex-grow: 0;
                max-height: unset;
                overflow: visible;
            }
            #original-text-display, #side-info-panel {
                max-height: 40vh; /* 手机上原文和侧边栏高度限制 */
                min-height: 15vh;
                width: 100%;
                font-size: 1.1em;
                padding: 15px;
                overflow-y: auto;
            }
            #side-info-panel {
                min-width: unset;
            }
            #result-display {
                font-size: 1em;
            }
            .pronounce-btn {
                width: 50px;
                height: 50px;
                font-size: 1.6em;
                align-self: center;
            }
            #typing-input {
                font-size: 1.2em;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>小小打字员</h1>
        
        <div id="controls-panel">
            <label for="file-upload" class="custom-file-upload">
                <i class="fas fa-cloud-upload-alt"></i> 选择文本文件
            </label>
            <input id="file-upload" type="file" accept=".txt,.md"/>
            <button id="upload-btn">上传并开始</button>
            
            <select id="text-selector">
                <option value="">或选择已上传的文本</option>
                </select>
            <button id="load-text-btn">加载文本</button>
        </div>

        <div id="main-content">
            <div id="original-text-display"></div>
            
            <div id="side-info-panel">
                <div id="result-display">
                    <span class="result-word"></span>
                    <span class="result-definition"></span>
                </div>
                <button id="pronounce-button" class="pronounce-btn" disabled>
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>

        <input type="text" id="typing-input" placeholder="开始输入...">
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
