<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>键学 · BBC 6 Minute English 打字练习</title>
    <link rel="stylesheet" href="assets/pico.min.css">
    <link rel="stylesheet" href="assets/app.css">
</head>
<body>
    <main class="container app">
        <header class="app-header">
            <h1 class="app-title">键学</h1>
            <select id="episode-selector" aria-label="选择节目">
                <option value="">加载节目中…</option>
            </select>
            <div id="episode-meta"></div>
        </header>

        <div id="notice" role="alert" hidden></div>

        <div id="dialog-display" aria-label="对白" tabindex="-1"></div>

        <input type="text" id="typing-input" placeholder="输入上方高亮的单词，空格或标点结束…" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>

        <footer class="app-footer">
            <span id="hint-current"></span>
            <span id="hint-progress"></span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
