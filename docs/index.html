<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>键学 · BBC 6 Minute English 打字练习</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background-color: #eef2f7;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box; /* max-width 必须含 padding，否则窄屏横向溢出 */
            height: calc(100vh - 40px);
            overflow: hidden;
            text-align: center;
            border: 1px solid #e0e6ed;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #2c3e50;
            margin: 0 0 6px 0;
            font-size: 2.2em;
        }
        .subtitle {
            color: #6c757d;
            font-size: 0.95em;
            margin-bottom: 20px;
        }

        #episode-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px dashed #cad2db;
            border-radius: 8px;
            background-color: #f9fbfd;
        }
        #episode-selector {
            flex: 1;
            min-width: 260px;
            max-width: 520px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            background-color: white;
            cursor: pointer;
        }
        #load-episode-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            background-color: #ffc107;
            color: #333;
            transition: background-color 0.3s ease;
        }
        #load-episode-btn:hover {
            background-color: #e0a800;
        }
        #episode-meta {
            flex-basis: 100%;
            font-size: 0.92em;
            color: #495057;
        }
        #episode-meta .bbc-link {
            color: #007bff;
        }
        .remaining-days {
            color: #b06a00;
            background-color: #fff3cd;
            border-radius: 4px;
            padding: 1px 8px;
            margin-left: 6px;
        }
        #notice {
            display: none;
            margin: 0 0 14px 0;
            padding: 10px 16px;
            border-radius: 8px;
            background-color: #fff3cd;
            border: 1px solid #ffe69c;
            color: #664d03;
            font-size: 0.95em;
            text-align: left;
        }

        #main-content {
            display: flex;
            gap: 25px;
            flex-grow: 1;
            margin-bottom: 25px;
            overflow: hidden;
        }

        #original-text-display {
            flex: 3;
            font-size: 1.4em;
            padding: 20px;
            border: 1px dashed #cad2db;
            border-radius: 8px;
            max-height: 100%;
            overflow-y: auto;
            text-align: left;
            line-height: 1.8;
            word-wrap: break-word;
            background-color: #f9fbfd;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        #side-info-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            background-color: #eef2f7;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
            min-width: 260px;
            max-height: 100%;
            overflow: hidden;
        }

        #result-display {
            flex-grow: 1;
            text-align: left;
            font-size: 1.2em;
            color: #4a4a4a;
            word-wrap: break-word;
            line-height: 1.6;
            overflow-y: auto;
            padding-bottom: 10px;
        }
        .result-word {
            font-weight: normal;
            color: #6c757d;
            margin-bottom: 5px;
            display: block;
            font-size: 0.9em;
        }
        .result-translation {
            font-style: normal;
            font-weight: bold;
            color: #333;
            display: block;
            font-size: 1.1em;
        }
        .result-context {
            display: block;
            margin-top: 10px;
            padding: 10px 12px;
            background-color: #e7f4ff;
            border-left: 4px solid #2d8fdd;
            border-radius: 4px;
            font-weight: normal;
            font-size: 0.92em;
            color: #14507f;
        }
        .result-context .ctx-label {
            font-weight: bold;
        }
        .result-sentence {
            display: block;
            margin-top: 8px;
            font-size: 0.88em;
            color: #5a6b7b;
            font-style: italic;
        }
        .source-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.72em;
            font-weight: normal;
            vertical-align: middle;
        }
        .source-official { background-color: #d4edda; color: #155724; }
        .source-context  { background-color: #cce5ff; color: #004085; }
        .source-ecdict   { background-color: #e2e3e5; color: #383d41; }

        .pronounce-btn {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.6em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
            align-self: flex-end;
            margin-top: auto;
        }
        .pronounce-btn:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
        .pronounce-btn:active {
            transform: scale(0.98);
        }
        .pronounce-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #typing-input {
            width: calc(100% - 40px);
            padding: 15px 20px;
            font-size: 1.4em;
            border: 2px solid #007bff;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.1);
            align-self: center;
        }
        #typing-input:focus {
            border-color: #0056b3;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.2);
        }
        #typing-input:disabled {
            background-color: #f1f3f5;
            color: #adb5bd;
        }

        .word-correct {
            color: #28a745;
            font-weight: bold;
        }
        .current-word {
            background-color: #d1ecf1;
            color: #0c5460;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 0 5px rgba(209, 236, 241, 0.5);
        }
        .correct-input-border {
            border-color: #28a745 !important;
        }
        .incorrect-input-border {
            border-color: #dc3545 !important;
        }

        /* 媒体查询：适配小屏幕设备（如手机） */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                max-width: 95vw;
                padding: 20px;
                height: calc(100vh - 20px);
            }
            h1 {
                font-size: 1.8em;
            }
            #episode-bar {
                flex-direction: column;
                gap: 12px;
                padding: 12px;
            }
            #episode-selector, #load-episode-btn {
                width: 100%;
            }
            #main-content {
                flex-direction: column;
                gap: 20px;
                flex-grow: 0;
                max-height: unset;
                overflow: visible;
            }
            #original-text-display, #side-info-panel {
                max-height: 40vh;
                min-height: 15vh;
                width: 100%;
                box-sizing: border-box; /* width:100% + padding 不设 border-box 会横向溢出 */
                font-size: 1.1em;
                padding: 15px;
                overflow-y: auto;
            }
            #side-info-panel {
                min-width: unset;
            }
            #result-display {
                font-size: 1em;
            }
            .pronounce-btn {
                width: 50px;
                height: 50px;
                align-self: center;
            }
            #typing-input {
                font-size: 1.2em;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>键学</h1>
        <div class="subtitle">BBC 6 Minute English · 滚动保留最近 30 天节目</div>

        <div id="episode-bar">
            <select id="episode-selector">
                <option value="">加载节目中…</option>
            </select>
            <button id="load-episode-btn">加载节目</button>
            <span id="episode-meta"></span>
        </div>

        <div id="notice"></div>

        <div id="main-content">
            <div id="original-text-display"></div>

            <div id="side-info-panel">
                <div id="result-display">
                    <span class="result-word"></span>
                    <span class="result-translation"></span>
                    <span class="result-context"></span>
                    <span class="result-sentence"></span>
                </div>
                <button id="pronounce-button" class="pronounce-btn" disabled title="重播发音">🔊</button>
            </div>
        </div>

        <input type="text" id="typing-input" placeholder="选择节目后开始输入…" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <script src="script.js"></script>
</body>
</html>
